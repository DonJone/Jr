[package]
name = "jr"
version = "3.0.0"
edition = "2021"
authors = ["Don <zjy3293994697@gmail.com>"]
description = "A minimalist terminal journal for developers who think in the terminal."
license = "AGPL-3.0"
repository = "https://github.com/DonJone/jr"
readme = "README.md"
keywords = ["journal", "cli", "git", "markdown", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
colored = "2.1"
dirs = "5.0"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
walkdir = "2.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "jr"
path = "src/main.rs"
